name: CI / Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-version:
    name: Sync Release Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name || steps.branch.outputs.tag_name }}
      skip_release: ${{ steps.pr.outputs.skip_release || steps.resolve.outputs.skip_release || steps.branch.outputs.skip_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve pull request
        id: pr
        if: github.event_name == 'pull_request'
        run: |
          echo "skip_release=false" >> "$GITHUB_OUTPUT"

      - name: Validate pushed tag
        id: resolve
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_name="${GITHUB_REF_NAME}"
          if [[ ! "${tag_name}" == v* ]]; then
            echo "Expected a v-prefixed release tag, got '${tag_name}'"
            exit 1
          fi
          app_version=$(PYTHONPATH=src python - <<'PY'
          from stormfuse.config import APP_VERSION
          print(APP_VERSION)
          PY
          )
          expected_tag="v${app_version}"
          if [[ "${tag_name}" != "${expected_tag}" ]]; then
            echo "Tag ${tag_name} does not match APP_VERSION ${app_version}"
            exit 1
          fi
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "skip_release=false" >> "$GITHUB_OUTPUT"

      - name: Sync branch version
        id: branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin
          git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=v:refname > /tmp/release-tags.txt
          result=$(python scripts/sync_release_version.py \
            --root . \
            --tags-file /tmp/release-tags.txt \
            --date "$(date -u +%F)" \
            --write)
          echo "${result}"
          tag_name=$(python -c "import json, sys; print(json.loads(sys.argv[1])['tag_name'])" "${result}")
          bumped=$(python -c "import json, sys; print(str(json.loads(sys.argv[1])['bumped']).lower())" "${result}")

          if [[ "${bumped}" == "true" ]]; then
            bump_branch="release/${tag_name}"
            git add src/stormfuse/config.py README.md CHANGELOG.md
            git commit -m "Release ${tag_name}"
            git push --force-with-lease origin "HEAD:${bump_branch}"
            if ! gh pr create \
              --base master \
              --head "${bump_branch}" \
              --title "Release ${tag_name}" \
              --body "Automated APP_VERSION release bump for ${tag_name}."; then
              gh pr view "${bump_branch}" --json url \
                || echo "::warning::Pushed ${bump_branch}; create the release bump PR manually or enable Actions-created pull requests."
            fi
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            echo "Tag ${tag_name} already exists; APP_VERSION sync should have bumped it"
            exit 1
          fi

          echo "skip_release=false" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

  lint-and-test:
    name: Lint & Test
    needs: sync-version
    if: needs.sync-version.outputs.skip_release != 'true'
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: make deps

      - name: Lint
        run: make lint

      - name: Generate third-party notices
        run: make generate-third-party

      - name: Unit tests
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          verbose: true
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v6
        if: ${{ env.CODECOV_TOKEN != '' && !cancelled() }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          verbose: true
          fail_ci_if_error: false

  create-tag:
    name: Create Release Tag
    if: github.event_name != 'pull_request' && needs.sync-version.outputs.skip_release != 'true'
    needs: [sync-version, lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create or resolve tag
        id: tag
        run: |
          tag_name="${{ needs.sync-version.outputs.tag_name }}"
          if [[ -z "${tag_name}" ]]; then
            echo "Release tag output was empty"
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            echo "Tag ${tag_name} already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag_name}" -m "Release ${tag_name}"
          git push origin "refs/tags/${tag_name}"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

  build-installer:
    name: Build Installer
    if: github.event_name != 'pull_request' && needs.sync-version.outputs.skip_release != 'true'
    needs: [sync-version, lint-and-test, create-tag]
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ needs.create-tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG_NAME }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        shell: bash
        run: make deps

      - name: Fetch ffmpeg
        shell: bash
        run: make fetch-ffmpeg

      - name: Generate third-party notices
        shell: bash
        run: make generate-third-party

      - name: Run unit tests
        shell: bash
        run: make test

      - name: Ensure NSIS
        shell: pwsh
        run: |
          $nsisX86 = "${env:ProgramFiles(x86)}\\NSIS\\makensis.exe"
          $nsisX64 = "${env:ProgramFiles}\\NSIS\\makensis.exe"
          if ((Test-Path $nsisX86) -or (Test-Path $nsisX64)) {
            Write-Host "NSIS already installed"
          } else {
            choco install nsis -y
          }

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $nsisDir = "${env:ProgramFiles(x86)}\\NSIS"
          if (-not (Test-Path $nsisDir)) {
            $nsisDir = "${env:ProgramFiles}\\NSIS"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: bash
        run: make installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: StormFuse-installer
          path: dist/StormFuse-Setup-*.exe

  release:
    name: Create Release
    if: github.event_name != 'pull_request' && needs.sync-version.outputs.skip_release != 'true'
    needs: [sync-version, lint-and-test, create-tag, build-installer]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.create-tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.TAG_NAME }}

      - name: Download build artifacts
        run: gh run download "$GITHUB_RUN_ID" --name StormFuse-installer --dir .
        env:
          GH_TOKEN: ${{ github.token }}

      - name: List release assets
        run: find . -name "StormFuse-Setup-*.exe" -print

      - name: Generate release notes from changelog
        id: release_notes
        run: |
          PREV_TAG=$(python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ.get("GITHUB_REPOSITORY")
          current = os.environ.get("CURRENT_TAG", "")
          url = f"https://api.github.com/repos/{repo}/releases?per_page=20"

          tag = ""
          try:
              with urllib.request.urlopen(url, timeout=10) as resp:
                  data = json.load(resp)
              for release in data:
                  if release.get("draft"):
                      continue
                  rel_tag = release.get("tag_name", "")
                  if rel_tag and rel_tag != current:
                      tag = rel_tag
                      break
          except Exception:
              tag = ""

          if not tag:
              tags = os.popen("git tag --sort=-v:refname").read().strip().splitlines()
              for rel_tag in tags:
                  if rel_tag and rel_tag != current:
                      tag = rel_tag
                      break

          print(tag)
          PY
          )
          CURRENT_TAG="${{ env.TAG_NAME }}"

          CHANGELOG_SECTION=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_SECTION=$(PREV_TAG="$PREV_TAG" CURRENT_TAG="$CURRENT_TAG" python scripts/release_notes.py)
          fi

          {
            echo "body<<RELEASE_EOF"
            if [ -n "$CHANGELOG_SECTION" ]; then
              echo "## What's Changed"
              echo ""
              echo "$CHANGELOG_SECTION"
              echo ""
            fi
            echo "---"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          CURRENT_TAG: ${{ env.TAG_NAME }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            **/StormFuse-Setup-*.exe
