name: CI / Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release:
        description: 'Create tag and publish a release (master or an existing tag only)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Release Info
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.r.outputs.is_release }}
      create_tag: ${{ steps.r.outputs.create_tag }}
      tag_name: ${{ steps.r.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release info
        id: r
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DISPATCH_RELEASE: ${{ inputs.release }}
        run: python scripts/release_info.py

  lint-and-test:
    name: Lint & Test
    needs: resolve
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: make deps

      - name: Lint
        run: make lint

      - name: Generate third-party notices
        run: make generate-third-party

      - name: Unit tests
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          verbose: true
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ env.CODECOV_TOKEN != '' && !cancelled() }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          verbose: true
          fail_ci_if_error: false

  create-tag:
    name: Create Release Tag
    if: needs.resolve.outputs.is_release == 'true'
    needs: [resolve, lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      tag_sha: ${{ steps.tag.outputs.tag_sha }}
    env:
      TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.create_tag == 'true' && 'master' || format('refs/tags/{0}', needs.resolve.outputs.tag_name) }}

      - name: Create or resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ needs.resolve.outputs.create_tag }}" != "true" ]]; then
            echo "tag_sha=$(git rev-parse refs/tags/${TAG_NAME})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit_sha=$(git rev-parse HEAD)
          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            --field "ref=refs/tags/${TAG_NAME}" \
            --field "sha=${commit_sha}"
          echo "tag_sha=${commit_sha}" >> "$GITHUB_OUTPUT"

  build-installer:
    name: Build Installer
    if: needs.resolve.outputs.is_release == 'true'
    needs: [resolve, create-tag]
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Write release version file
        shell: bash
        run: python scripts/write_version.py --tag "${TAG_NAME}"

      - name: Install dependencies
        shell: bash
        run: make deps

      - name: Fetch ffmpeg
        shell: bash
        run: make fetch-ffmpeg

      - name: Generate third-party notices
        shell: bash
        run: make generate-third-party

      - name: Run unit tests
        shell: bash
        run: make test

      - name: Ensure NSIS
        shell: pwsh
        run: |
          $nsisX86 = "${env:ProgramFiles(x86)}\\NSIS\\makensis.exe"
          $nsisX64 = "${env:ProgramFiles}\\NSIS\\makensis.exe"
          if ((Test-Path $nsisX86) -or (Test-Path $nsisX64)) {
            Write-Host "NSIS already installed"
          } else {
            choco install nsis -y
          }

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $nsisDir = "${env:ProgramFiles(x86)}\\NSIS"
          if (-not (Test-Path $nsisDir)) {
            $nsisDir = "${env:ProgramFiles}\\NSIS"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: bash
        run: make installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: StormFuse-installer
          path: dist/StormFuse-Setup-*.exe

  release:
    name: Create Release
    if: needs.resolve.outputs.is_release == 'true'
    needs: [resolve, create-tag, build-installer]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}

      - name: Download build artifacts
        run: gh run download "$GITHUB_RUN_ID" --name StormFuse-installer --dir .
        env:
          GH_TOKEN: ${{ github.token }}

      - name: List release assets
        run: find . -name "StormFuse-Setup-*.exe" -print

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: |
            **/StormFuse-Setup-*.exe
